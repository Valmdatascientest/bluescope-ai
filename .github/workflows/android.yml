name: Android CI

on:
  push:
    branches: [main, feature/bluescope-ai]
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Analyse statique
        run: ./gradlew lintDebug --stacktrace
      - name: Tests JVM
        run: ./gradlew testDebugUnitTest :core:domain:test :core:ai:test --stacktrace
      - name: APK debug
        run: ./gradlew assembleDebug --stacktrace
      - name: Compilation release non signée
        run: ./gradlew assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bluescope-ci-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: bluescope-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests instrumentés API 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bluescope-instrumented-reports
          path: "**/build/reports/androidTests/**"
          retention-days: 14
